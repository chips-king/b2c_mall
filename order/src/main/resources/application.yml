spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: order-service
  config:
    # 连接信息在本地确定；端口等远程配置由同一命名空间的 Data ID 导入。
    import: nacos:order-service.yml?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        file-extension: yml
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
  datasource:
    # 显式指定新版数据库，避免误用旧版结构；父目录须已存在。
    url: jdbc:sqlite:${ORDER_DB_PATH}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
mybatis:
  mapper-locations: classpath:/mapper/*.xml
liteflow:
  rule-source: config/flow.xml
  print-execution-log: true
feign:
  client:
    config:
      employee-service:
        connectTimeout: ${EMPLOYEE_CONNECT_TIMEOUT_MS:3000}
        readTimeout: ${EMPLOYEE_READ_TIMEOUT_MS:5000}
        loggerLevel: none
      product-service:
        connectTimeout: ${PRODUCT_CONNECT_TIMEOUT_MS:3000}
        readTimeout: ${PRODUCT_READ_TIMEOUT_MS:5000}
        loggerLevel: none

mall:
  payment:
    # 模拟渠道的HMAC签名密钥；缺失时阻止启动，不能使用仓库内固定密钥。
    callback-secret-base64: ${PAYMENT_CALLBACK_SECRET_BASE64}
