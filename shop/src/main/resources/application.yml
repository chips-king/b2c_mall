spring:
  application:
    name: shop-service
  config:
    # 连接信息在本地确定；端口等远程配置由同一命名空间的 Data ID 导入。
    import: nacos:shop-service.yml?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        file-extension: yml
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
  datasource:
    # 显式指定新版数据库，避免误用旧版结构；父目录须已存在。
    url: jdbc:sqlite:${SHOP_DB_PATH}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
mybatis:
  mapper-locations: classpath:/mapper/*.xml
mall:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}
  initialization:
    threads: ${SHOP_INIT_THREADS:2}
    queue-capacity: ${SHOP_INIT_QUEUE_CAPACITY:100}
    timeout-seconds: ${SHOP_INIT_TIMEOUT_SECONDS:60}
    scan-interval-ms: ${SHOP_INIT_SCAN_INTERVAL_MS:5000}
feign:
  client:
    config:
      employee-service:
        connectTimeout: ${EMPLOYEE_CONNECT_TIMEOUT_MS:3000}
        readTimeout: ${EMPLOYEE_READ_TIMEOUT_MS:5000}
        # 内部认证头和密码哈希不写入 Feign 请求日志。
        loggerLevel: none
